name: Check Auction Ledger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup update stable --no-self-update
      - run: cargo build --release --locked --manifest-path publisher/Cargo.toml
      - run: cargo test --locked --manifest-path publisher/Cargo.toml
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
